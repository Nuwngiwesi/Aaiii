
name: Build LYNKO AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Find Gradle project
        id: find_gradle
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          ls -la

          SETTINGS_FILE="$(find . -maxdepth 6 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found."
            echo "The Android project may be missing from this repository."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Found Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build LYNKO AI APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_gradle.outputs.project_dir }}
        run: |
          set -e
          gradle -p "$PROJECT_DIR" \
            :android:app:assembleDebug \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LYNKO-AI-debug-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 7
